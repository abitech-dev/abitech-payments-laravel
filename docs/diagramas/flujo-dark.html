<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cómo cobra Payments y recibe los avisos</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #080e16; color: #e3e8ee; padding: 3rem 1rem; }
    .frame { max-width: 1200px; width: 100%; min-width: 0; margin: 0 auto; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="diagram-container">
      <svg viewBox="0 112 960 176" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flujo-dark-title flujo-dark-desc">
        <title id="flujo-dark-title">Cómo cobra Payments y recibe los avisos</title>
        <desc id="flujo-dark-desc">Tu app pide el cobro a Payments, que habla con la pasarela; la pasarela avisa por webhook, Payments verifica la firma y devuelve a tu app un DTO normalizado.</desc>
        <defs>
          <marker id="flujo-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a2acb7"/></marker>
          <marker id="flujo-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5aa9f2"/></marker>
        </defs>
        <rect x="0" y="112" width="960" height="176" fill="#080e16"/>
        <line x1="240" y1="176" x2="360" y2="176" stroke="#5aa9f2" stroke-width="1.4" marker-end="url(#flujo-dark-arrow-accent)"/>
        <line x1="600" y1="176" x2="720" y2="176" stroke="#a2acb7" stroke-width="1.2" marker-end="url(#flujo-dark-arrow)"/>
        <line x1="720" y1="224" x2="600" y2="224" stroke="#a2acb7" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#flujo-dark-arrow)"/>
        <line x1="360" y1="224" x2="240" y2="224" stroke="#a2acb7" stroke-width="1.2" marker-end="url(#flujo-dark-arrow)"/>
        <rect x="274.0" y="151" width="52" height="16" rx="2" fill="#080e16"/>
        <text x="300" y="163" fill="#a2acb7" font-size="11" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">COBRO</text>
        <rect x="642.0" y="151" width="36" height="16" rx="2" fill="#080e16"/>
        <text x="660" y="163" fill="#a2acb7" font-size="11" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">API</text>
        <rect x="626.0" y="199" width="68" height="16" rx="2" fill="#080e16"/>
        <text x="660" y="211" fill="#a2acb7" font-size="11" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">WEBHOOK</text>
        <rect x="282.0" y="199" width="36" height="16" rx="2" fill="#080e16"/>
        <text x="300" y="211" fill="#a2acb7" font-size="11" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">DTO</text>
        <rect x="40" y="152" width="200" height="96" rx="6" fill="#080e16"/>
        <rect x="40" y="152" width="200" height="96" rx="6" fill="#121921" stroke="#e3e8ee" stroke-width="1"/>
        <text x="140.0" y="198.0" fill="#e3e8ee" font-size="16" font-family="'Inter', system-ui, sans-serif" text-anchor="middle" font-weight="600">Tu app Laravel</text>
        <text x="140.0" y="216.0" fill="#a2acb7" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">PaymentRequest</text>
        <rect x="360" y="136" width="240" height="128" rx="6" fill="#080e16"/>
        <rect x="360" y="136" width="240" height="128" rx="6" fill="rgba(90,169,242,0.12)" stroke="#5aa9f2" stroke-width="1.4"/>
        <text x="480.0" y="198.0" fill="#e3e8ee" font-size="16" font-family="'Inter', system-ui, sans-serif" text-anchor="middle" font-weight="600">Payments</text>
        <text x="480.0" y="216.0" fill="#a2acb7" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">abitechdev/payments-laravel</text>
        <rect x="720" y="136" width="200" height="128" rx="6" fill="#080e16"/>
        <rect x="720" y="136" width="200" height="128" rx="6" fill="rgba(227,232,238,0.03)" stroke="rgba(227,232,238,0.30)" stroke-width="1"/>
        <text x="820.0" y="198.0" fill="#e3e8ee" font-size="16" font-family="'Inter', system-ui, sans-serif" text-anchor="middle" font-weight="600">Pasarela</text>
        <text x="820.0" y="216.0" fill="#a2acb7" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">Mercado Pago o Stripe</text>
      </svg>
    </div>
  </div>
</body>
</html>
