<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Cómo cobra y recibe avisos el paquete</title>
  <desc id="descripcion">Tu app pide el cobro al driver, que habla con Mercado Pago o Stripe. Luego la pasarela avisa por webhook, el paquete verifica la firma y tu app decide.</desc>
  <defs>
    <marker id="punta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#59636e"/>
    </marker>
  </defs>
  <rect width="920" height="300" rx="16" fill="#ffffff"/>
  <text x="28" y="40" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#1c6ccc">COBRAR</text>
  
  <rect x="28" y="56" width="170" height="70" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="113.0" y="86" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328">Tu app</text>
  <text x="113.0" y="107" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="11.5" fill="#59636e">PaymentRequest</text>
  
  <line x1="198" y1="91" x2="258" y2="91" stroke="#59636e" stroke-width="1.5" marker-end="url(#punta)"/><text x="228.0" y="83" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#59636e">driver()</text>
  
  <rect x="260" y="56" width="210" height="70" rx="12" fill="#ddf4ff" stroke="#1c6ccc" stroke-width="1.5"/>
  <text x="365.0" y="86" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328">Payments</text>
  <text x="365.0" y="107" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="11.5" fill="#59636e">purchase()</text>
  
  <line x1="470" y1="91" x2="530" y2="91" stroke="#59636e" stroke-width="1.5" marker-end="url(#punta)"/><text x="500.0" y="83" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#59636e">API</text>
  
  <rect x="532" y="56" width="190" height="70" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="627.0" y="86" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328">Pasarela</text>
  <text x="627.0" y="107" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="11.5" fill="#59636e">Mercado Pago o Stripe</text>
  
  <line x1="722" y1="91" x2="772" y2="91" stroke="#59636e" stroke-width="1.5" marker-end="url(#punta)"/>
  
  <rect x="774" y="56" width="120" height="70" rx="12" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="834.0" y="86" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328">Respuesta</text>
  <text x="834.0" y="107" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="11.5" fill="#59636e">redirectUrl</text>
  <text x="28" y="184" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#1c6ccc">RECIBIR AVISOS</text>
  
  <rect x="28" y="200" width="170" height="70" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="113.0" y="230" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328">Pasarela</text>
  <text x="113.0" y="251" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="11.5" fill="#59636e">webhook</text>
  
  <line x1="198" y1="235" x2="258" y2="235" stroke="#59636e" stroke-width="1.5" marker-end="url(#punta)"/><text x="228.0" y="227" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#59636e">aviso</text>
  
  <rect x="260" y="200" width="210" height="70" rx="12" fill="#ddf4ff" stroke="#1c6ccc" stroke-width="1.5"/>
  <text x="365.0" y="230" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328">Payments</text>
  <text x="365.0" y="251" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="11.5" fill="#59636e">firma verificada</text>
  
  <line x1="470" y1="235" x2="530" y2="235" stroke="#59636e" stroke-width="1.5" marker-end="url(#punta)"/><text x="500.0" y="227" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#59636e">normaliza</text>
  
  <rect x="532" y="200" width="190" height="70" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="627.0" y="230" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328">WebhookResult</text>
  <text x="627.0" y="251" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="11.5" fill="#59636e">monto y estado</text>
  
  <line x1="722" y1="235" x2="772" y2="235" stroke="#59636e" stroke-width="1.5" marker-end="url(#punta)"/>
  
  <rect x="774" y="200" width="120" height="70" rx="12" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="834.0" y="230" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328">Tu app</text>
  <text x="834.0" y="251" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="11.5" fill="#59636e">decide</text>
</svg>
